name: On-Demand Local AI Marking

on:
  workflow_dispatch:

jobs:
  run-local-ollama:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Pulls full git commit history

      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Pulls full git commit histories

      - name: Register Upstream Boilerplate Baseline
        run: |
          git remote add upstream https://github.com/jhill1/feedback_assisstant.git
          git fetch upstream main
      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ollama pydantic

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama Server
        run: |
          ollama serve > ollama.log 2>&1 &
          
      - name: Wait for Ollama to Initialize
        run: |
          echo "Waiting for Ollama server to wake up..."
          until curl -s http://127.0.0.1:11434 > /dev/null; do
            sleep 2
          done
          echo "Ollama is active!"

      - name: Pull Lightweight Model
        run: |
          ollama pull llama3.2

      - name: Execute Local AI Evaluation Loop
        run: |
          python mark_script.py > evaluation_output.md
          cat evaluation_output.md >> $GITHUB_STEP_SUMMARY
